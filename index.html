<!doctype html>
<!-- lang="he" ו-dir="rtl": האתר בעברית, והכיוון מימין לשמאל -->
<html lang="he" dir="rtl">
  <head>
    <!-- קידוד התווים: UTF-8, כדי שעברית תוצג נכון -->
    <meta charset="UTF-8" />
    <!-- הסמל שמופיע בלשונית של הדפדפן -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- התאמה לטלפון: רוחב העמוד הוא רוחב המסך -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- תיאור קצר של האתר (למנועי חיפוש) -->
    <meta name="description" content="ShareFund – ניהול קופה משותפת לקבוצה: הפקדות, משיכות ויתרה לכל חבר" />
    <!-- חיבור מוקדם לשרת הגופנים של Google, כדי שהגופן ייטען מהר יותר -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- הגופן Heebo: גופן עברי נקי וקריא, במשקלים 400 עד 800 -->
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <!-- הכותרת בלשונית של הדפדפן -->
    <title>ShareFund</title>
  </head>
  <body>
    <!-- כאן React מצייר את כל האפליקציה -->
    <div id="root"></div>
    <!-- נקודת הכניסה של הקוד -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
